name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      # 拉取代码
      - uses: actions/checkout@v4
      # 缓存 APT 包目录
      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: ${{ runner.os }}-apt-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-apt-
      # 安装依赖
      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Install python dependencies
        run: pip install beautifulsoup4 pandas pypinyin requests pillow
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"
      - name: Setup mdbook-katex
        uses: supplypike/setup-bin@v4
        with:
          uri: "https://github.com/lzanini/mdbook-katex/releases/download/0.9.2-binaries/mdbook-katex-v0.9.2-x86_64-unknown-linux-gnu.tar.gz"
          name: "mdbook-katex"
          version: "0.9.2"
      # 补全网页内容
      - name: Run Makefile
        run: make all
      # 部署网页
      - name: Build dist directory
        run: |
          mkdir -p dist
          rsync -av website/ dist/ \
            --exclude='*.py' \
            --exclude='__pycache__/' \
            --exclude='.gitignore' \
            --exclude='Makefile'
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}