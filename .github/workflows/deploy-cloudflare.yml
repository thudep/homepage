name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      # 拉取代码
      - uses: actions/checkout@v4

      # 缓存文件
      - name: Cache pandoc deb  # 缓存 pandoc 的 deb 包
        uses: actions/cache@v4
        with:
          path: ~/deb-cache
          key: ${{ runner.os }}-pandoc-3.1.3
      - name: Cache Python artifacts  # 缓存爬虫产物
        id: cache-python
        uses: actions/cache@v4
        with:
          path: |
            cache_dir/
          key: ${{ runner.os }}-pycache-${{ hashFiles('content/publicity/publicity.csv', 'content/index/show.csv') }}
          restore-keys: |
            ${{ runner.os }}-pycache-
      - name: Prepare cache dir
        run: mkdir -p cache_dir

      # 安装依赖
      - name: Download pandoc  # 下载 deb（只在缓存不存在时执行）
        run: |
          mkdir -p ~/deb-cache
          cd ~/deb-cache
          if [ ! -f pandoc_3.1.3+ds-2_amd64.deb ]; then
            echo "Downloading pandoc deb files..."
            sudo apt-get update
            apt-get download pandoc
            apt-get download pandoc-data
          else
            echo "Using cached pandoc deb files."
          fi
      - name: Install pandoc  # 安装 pandoc
        run: |
          sudo dpkg -i ~/deb-cache/*.deb || sudo apt-get install -f -y
          pandoc --version
      - name: Install python dependencies  # 下载 python 包
        run: pip install beautifulsoup4 pandas pypinyin requests pillow
      - name: Setup mdBook  # 安装 mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"
      - name: Setup mdbook-katex  # 安装 mdbook-katex
        uses: supplypike/setup-bin@v4
        with:
          uri: "https://github.com/lzanini/mdbook-katex/releases/download/0.9.2-binaries/mdbook-katex-v0.9.2-x86_64-unknown-linux-gnu.tar.gz"
          name: "mdbook-katex"
          version: "0.9.2"

      # 补全网页内容
      - name: Run Makefile  # 运行 Makefile
        run: make all
      - name: Save updated cache  # 保存爬虫产物
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache_dir/
          key: ${{ steps.cache-python.outputs.cache-primary-key }}

      # 部署网页
      - name: Build dist directory  # 构造不含生成网页源代码的文件夹
        run: |
          mkdir -p dist
          rsync -av website/ dist/ \
            --exclude='*.py' \
            --exclude='__pycache__/' \
            --exclude='.gitignore' \
            --exclude='Makefile'
      - name: Deploy  # 使用 wrangler 上传
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}