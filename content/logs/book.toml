[book]
authors = ["depsast"]
description = "清华大学工物科协日志"
language = "zh-CN"
multilingual = false
src = "./src"
title = "清华大学工物科协日志"

[preprocessor.katex]
after = ["links"]
output = "htmlAndMathml"
pre-render = true

[output.html]
git-repository-url = "https://github.com/thudep/homepage"

[output.html.search]
boost-hierarchy = 2
boost-paragraph = 1
boost-title = 2
expand = true
heading-split-level = 2
limit-results = 20
use-boolean-and = true